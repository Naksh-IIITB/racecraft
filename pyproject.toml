[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racecraft"
version = "0.1.0"
description = "Counterfactual Formula 1 race strategy simulator"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "plotly>=5.18",
  "pyarrow>=14",
  "requests>=2.31",
  "streamlit>=1.31",
]

[project.optional-dependencies]
fastf1 = ["fastf1>=3.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
